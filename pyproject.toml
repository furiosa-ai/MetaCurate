[project]
name = "meta-filter"
version = "0.1.0"
description = "Counterexample-driven filter/rubric optimization for agent trajectories"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=25.0.1",
    "PyYAML>=6.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.121.0",
    "openai>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "src/meta_filter"]

[project.scripts]
meta-filter = "meta_filter.cli:app"

[tool.ruff]
target-version = "py312"
line-length = 100
# The seed filters are inputs, not code under maintenance: their bytes reach
# the proposer prompt and the rule critic's cache key, so they are never
# reformatted.
extend-exclude = ["filters"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.5",
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]
